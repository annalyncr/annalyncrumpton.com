    <feDisplacementMap in="textured" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- solid backing so the crayon speckles never show the page through -->
  <rect fill="#E8ECDD" x="-10" y="-10" width="820" height="320"/>
