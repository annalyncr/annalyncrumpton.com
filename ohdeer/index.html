<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#56703F" />
    <title>ohdeer</title>
    <!-- Fonts: Gaegu (hand-lettered headings) + Nunito (body text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- React draws the whole app inside this div -->
    <!-- An invisible SVG filter that CSS uses (filter: url(#wobble)) to make
         borders look hand-drawn. Raise "scale" for wobblier lines. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="wobble">
        <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="2" />
        <feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
